[pytest]
# Only the real-Home-Assistant suite is collected.  tests/test_billing.py and
# tests/test_coordinator.py are standalone scripts (run them with
# ``python3 -I tests/<file>.py``) that stub ``homeassistant.*`` so they need no
# dependency installed; pytest must not import them.
testpaths = tests/ha
asyncio_mode = auto

# Make the repo root importable so a test may do
# ``from custom_components.taipower_bill import ...`` at module level.
# Without this the suite only passes when invoked as ``python -m pytest``
# (``-m`` puts the current directory on ``sys.path``); the console script
# ``pytest`` -- which is what CI runs -- dies at *collection* with
# ``ModuleNotFoundError: No module named 'custom_components'`` and exits 2
# without running a single test.  That is exactly how v0.2.3 went red on
# GitHub Actions while passing locally.  With this line both invocations work,
# so keep the CI step as plain ``pytest -q``: it is what catches a regression.
pythonpath = .
